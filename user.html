<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Dashboard – Smart Campus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .report-card { border-radius: var(--radius-lg); overflow: hidden; background:white; }
    .file-input-label { width:100%; height:120px; border:2px dashed var(--border); border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; background:var(--bg); }
    .file-input-label:hover { border-color:var(--primary); background:var(--primary-light); }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR (CONSISTENT) -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fas fa-building-shield"></i></div>
      <div class="brand-name">Smart Campus</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Overview</div>
      <a class="nav-item active" href="/user"><i class="fas fa-plus-circle"></i> New Request</a>
      
      <div class="nav-label">Workflow</div>
      <a class="nav-item" href="#my-issues-section"><i class="fas fa-history"></i> My Submissions</a>
      
      <div class="nav-label">System</div>
      <a class="nav-item" href="#" onclick="toggleNotif()"><i class="fas fa-bell"></i> Notifications <span class="notif-badge" id="sidebar-notif-count" style="display:none; position:static; transform:scale(0.8); margin-left:auto;">0</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebar-avatar" style="background:var(--primary-light); color:var(--primary)">US</div>
        <div>
          <div class="user-name" id="sidebar-name">User</div>
          <div class="user-role">Student / Staff</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Report Issue <span class="topbar-subtitle">Raise a maintenance or security concern across the campus.</span></div>
      </div>
      <div class="topbar-actions">
        <div class="notif-btn" onclick="toggleNotif()"><i class="fas fa-bell"></i><span class="notif-badge" id="notif-count" style="display:none;">0</span></div>
        <button class="btn btn-ghost" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
      </div>
    </header>

    <div class="page-body">

      <div id="alert-area"></div>

      <div class="grid-2" style="align-items: start; gap: 32px;">

        <!-- REPORT FORM -->
        <div class="card report-card">
          <div class="card-header" style="background: white;">
            <div class="card-title" style="font-size: 16px;"><i class="fas fa-pencil-alt"></i> Submission Form</div>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">Issue Summary <span>*</span></label>
              <div class="input-wrap">
                <i class="fas fa-heading"></i>
                <input type="text" id="issue-title" class="form-control" placeholder="Short summary (e.g., Water leak in Lab A)" oninput="onTitleInput()" />
              </div>
            </div>

            <div class="grid-2" style="gap:16px">
              <div class="form-group">
                <label class="form-label">Category <span>*</span></label>
                <div class="input-wrap">
                   <i class="fas fa-tag"></i>
                   <select id="issue-category" class="form-control">
                    <option value="">Choose category</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Network">Network / WiFi</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Security">Security</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Location <span>*</span></label>
                <div class="input-wrap">
                  <i class="fas fa-location-dot"></i>
                  <input type="text" id="issue-location" class="form-control" placeholder="e.g. Block A, Room 201" list="location-list" />
                  <datalist id="location-list">
                    <option value="Block A – Room 101">
                    <option value="Block A – Room 201">
                    <option value="Block B – Lab 1">
                    <option value="Block B – Lab 2">
                    <option value="Block C – Ground Floor">
                    <option value="Library">
                    <option value="Auditorium">
                    <option value="Hostel Block">
                    <option value="Cafeteria">
                  </datalist>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Full Description <span>*</span></label>
              <textarea id="issue-desc" class="form-control" placeholder="Provide more details for the maintenance team..." style="min-height: 100px;"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Upload Evidence (Optional)</label>
              <div class="file-input-label" id="drop-zone" onclick="document.getElementById('issue-image').click()">
                <i class="fas fa-camera" style="font-size: 24px; color: var(--text-light); margin-bottom: 8px;"></i>
                <span id="file-name" style="font-size: 13px; color: var(--text-muted);">Click to attach image</span>
                <input type="file" id="issue-image" accept="image/*" style="display:none" onchange="previewImage(this)" />
              </div>
              <div id="image-preview-container" style="display:none; margin-top: 12px; position: relative;">
                 <img id="image-preview-img" src="" style="width:100%; height:180px; object-fit:cover; border-radius:12px; border:1px solid var(--border);" />
                 <button class="btn-sm btn-ghost" onclick="removeImage()" style="position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.8); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; padding:0;"><i class="fas fa-times"></i></button>
              </div>
            </div>

            <button class="btn btn-primary" style="width:100%; padding: 12px; margin-top:8px;" id="submit-btn" onclick="submitIssue()">
              <i class="fas fa-paper-plane"></i> Submit Request
            </button>
          </div>
        </div>

        <!-- HISTORY SECTION -->
        <section id="my-issues-section">
          <div class="section-header" style="margin-bottom: 16px;">
            <div class="section-title">My Recent History</div>
          </div>
          <div id="my-issues-list" style="display: flex; flex-direction: column; gap: 16px;">
             <!-- API rendered -->
          </div>
        </section>

      </div>
    </div>
  </main>
</div>

<!-- NOTIFICATION DRAWER -->
<div id="notif-drawer-overlay" class="modal-overlay" style="display:none; z-index:1099;" onclick="toggleNotif()"></div>
<aside id="notif-drawer" class="notif-drawer">
  <div class="notif-drawer-header">
    <div class="notif-drawer-title"><i class="fas fa-bell"></i> Notifications</div>
    <button class="btn-sm btn-ghost" onclick="toggleNotif()"><i class="fas fa-times"></i></button>
  </div>
  <div id="notif-list" class="notif-list">
    <!-- Rendered via JS -->
  </div>
</aside>

<script src="script.js"></script>
<script>
  let capturedImageData = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const user = requireAuth('user');
    if (!user) return;
    document.getElementById('sidebar-name').textContent = user.name;
    document.getElementById('sidebar-avatar').textContent = user.name.substring(0, 2).toUpperCase();
    await renderMyIssues();
  });

  async function submitIssue() {
    const title = document.getElementById('issue-title').value.trim();
    const cat = document.getElementById('issue-category').value;
    const loc = document.getElementById('issue-location').value.trim();
    const desc = document.getElementById('issue-desc').value.trim();
    const btn = document.getElementById('submit-btn');

    if (!title || !cat || !loc || !desc) {
      showAlert('danger', 'Please fill in all required fields.');
      return;
    }

    const priority = detectPriority(title, desc);
    const user = getUser();
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    
    await addIssue({
      id: 'ISS-' + Math.floor(1000 + Math.random() * 9000),
      title,
      category: cat,
      location: loc,
      description: desc,
      priority,
      reportedBy: user.email,
      image: capturedImageData
    });

    showAlert('success', '<strong>Success!</strong> Your request has been logged and assigned.');
    resetForm();
    await renderMyIssues();
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Request';
  }

  function resetForm() {
    document.getElementById('issue-title').value = '';
    document.getElementById('issue-category').value = '';
    document.getElementById('issue-location').value = '';
    document.getElementById('issue-desc').value = '';
    removeImage();
  }

  async function renderMyIssues() {
    const issues = await getIssues();
    const user = getUser();
    const myIssues = issues.filter(i => i.reportedBy === user.email);
    const container = document.getElementById('my-issues-list');

    if (!myIssues.length) {
      container.innerHTML = '<div class="empty-state">No issues reported yet.</div>';
      return;
    }

    container.innerHTML = myIssues.map(issue => `
      <div class="issue-card" id="issue-${issue.id}" style="padding:16px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          <div>
            <div style="font-weight:600; font-size:14px; color:var(--text);">${issue.title}</div>
            <div style="font-size:11px; font-family:'JetBrains Mono'; color:var(--text-muted);">${issue.id}</div>
          </div>
          <span class="badge badge-${issue.status.toLowerCase().replace(/\s+/g,'')}">${issue.status}</span>
        </div>
        <div style="font-size:12px; color:var(--text-muted);"><i class="fas fa-location-dot" style="margin-right:4px;"></i>${issue.location}</div>
      </div>
    `).join('');
  }

  function previewImage(input) {
    if (input.files[0]) {
      const reader = new FileReader();
      reader.onload = e => {
        capturedImageData = e.target.result;
        document.getElementById('drop-zone').style.display = 'none';
        document.getElementById('image-preview-container').style.display = 'block';
        document.getElementById('image-preview-img').src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function removeImage() {
    capturedImageData = null;
    document.getElementById('drop-zone').style.display = 'flex';
    document.getElementById('image-preview-container').style.display = 'none';
  }

  function onTitleInput() { /* duplicate check logic if needed */ }
</script>
</body>
</html>
